providers = ["node", "python"]

[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x"]

[phases.install]
# Hier installieren wir Node-Module UND die Python-Pakete sauber nebeneinander
cmds = [
    "npm install",
    "python -m venv /opt/venv",
    "/opt/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = ["npm run build"]

[start]
# Wir injizieren das Python-Environment in den globalen Pfad
cmd = "PATH=/opt/venv/bin:$PATH npm start"

