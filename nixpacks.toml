[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x", "python311", "gcc"]

[phases.install]
cmds = [
  "npm install",
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install web3 requests pandas duckduckgo-search ecdsa eth-account pycryptodome"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "PATH=/opt/venv/bin:$PATH npm start"

